# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (EM → EM-1, EM-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: ai-emoji-generator
  key: EM
spec:
  title: "Vercel's AI Emoji Generator on Cloudflare Workers, D1, R2 and KV"
  summary: "Vercel's AI Emoji Generator (pondorasti/emojis) — a prompt in, an emoji out: the prompt checked by a safety classifier, drawn by an SDXL model fine-tuned on emojis, its background removed, and every emoji kept in a gallery with related emojis by full-text search — runs on Cloudflare Workers + Static Assets with its emojis in D1, their images in R2 and its daily rate limit in Workers KV, its models on a Replicate account the owner connects after the build and every Replicate webhook verified, inside the Cirrus baseline's repository conventions, and becomes an Orun baseline that takes a new emoji generator from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "EM0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [EM-1]
    - name: "EM1 — the emoji generator on Workers, D1, R2 and KV"
      exitCriteria:
        - "apps/web is the upstream template on Next.js 16.3.8, built with webpack by OpenNext into one Worker with Static Assets, within Workers Free's 3 MiB"
        - "the emojis are a D1 table with an FTS5 index of their prompts; the images are R2 objects behind a delivery route; the daily limit is a KV counter; the API secret is generated in D1"
        - "without a Replicate token the site builds, serves the gallery and says how to connect Replicate, with no request sent; with one, a prompt is classified, generated and delivered back by webhooks verified by signature, age and a per-emoji token"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green, and the README says how every Vercel piece maps to Cloudflare"
      tasks: [EM-2]
    - name: "EM2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new emoji generator from nothing to live on stage and prod in one landing, then record it"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker, database, bucket and namespace names, with the template's AGPL-3.0 licence intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lanes' steps in staged job trees, the Worker served with no Replicate account and against a stand-in Replicate API that delivers signed webhooks"
      tasks: [EM-3]
