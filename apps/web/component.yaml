apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The AI emoji generator (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment; its emojis in D1, their images in R2, its rate limit in KV, its models on Replicate)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP. The Worker binds the D1 database by id, the R2 bucket by
  # name and the KV namespace by id, each rendered into its config during the
  # build from the wiring document its root lease-publishes after its apply;
  # and the app reads the emojis and its generated API secret, which
  # db-migrate creates in that database. A job resolves its secrets when it
  # STARTS, so on a merge to main this deploy waits for all four (enforced) —
  # one convergence runs cloudflare-d1 → db-migrate, cloudflare-r2 and
  # cloudflare-kv → web per environment, and the documents and the schema are
  # there. A pull request deploys nothing, so nothing on one waits (advisory).
  dependsOn:
    - component: cloudflare-d1
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: cloudflare-r2
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: cloudflare-kv
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: db-migrate
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ai-emoji-generator/ai-emoji-generator/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ai-emoji-generator/ai-emoji-generator/prod/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_R2_STAGE: "secret://ai-emoji-generator/ai-emoji-generator/stage/WIRING_CLOUDFLARE_R2"
    WIRING_CLOUDFLARE_R2_PROD: "secret://ai-emoji-generator/ai-emoji-generator/prod/WIRING_CLOUDFLARE_R2"
    WIRING_CLOUDFLARE_KV_STAGE: "secret://ai-emoji-generator/ai-emoji-generator/stage/WIRING_CLOUDFLARE_KV"
    WIRING_CLOUDFLARE_KV_PROD: "secret://ai-emoji-generator/ai-emoji-generator/prod/WIRING_CLOUDFLARE_KV"
  # The Replicate account's API token, stored per environment as the product's
  # secret REPLICATE_API_TOKEN (README → Connecting Replicate). The Worker
  # reads it at request time — and with it Replicate's webhook signing
  # secret, from Replicate's API — so the build hands it to the Worker as a
  # Worker secret and no bundle contains it (buildCommand below).
  # BEST-EFFORT, wire-now-seed-later: a key nobody has stored yet is skipped
  # when the job resolves its secrets (no env var, no failure), and the site
  # without it serves the gallery with a "connect Replicate" notice — so a
  # fresh product deploys and serves before its owner has a Replicate account
  # at all.
  optionalSecretEnv:
    REPLICATE_API_TOKEN: "secret://ai-emoji-generator/ai-emoji-generator/{{ .environment }}/REPLICATE_API_TOKEN"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: ai-emoji-generator-web-{dev,stage,prod}.
    workerName: ai-emoji-generator-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config, then build. stage and prod
    # render from the wiring documents their cloudflare-d1, cloudflare-r2 and
    # cloudflare-kv applies published (secretEnv above, resolved before the
    # job's first step); dev, which no root applies to and which only
    # verifies, renders from the committed fixture. The committed
    # wrangler.jsonc (the fixture render) is what the composition's
    # verify-app-structure step finds before this runs.
    #
    # NEXT_PUBLIC_SITE_URL is the environment's public origin — SITE_URL
    # (intent.yaml's environment env) or its workers.dev URL — which Replicate
    # delivers its webhooks to and the sitemap and Open Graph links are built
    # on. Replicate's token never reaches the build (`env -u`): the Worker
    # reads it at request time, so neither a bundle nor the bundler's cache
    # holds it. Then the token, when the environment has one, goes to the
    # Worker as a SECRET (tooling/wire/worker-secrets.mjs: `wrangler secret
    # bulk`, the value over stdin) before the composition deploys it. Only the
    # deploy lane holds a Cloudflare credential, so a verify lane builds the
    # same and pushes nothing.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-d1,cloudflare-r2,cloudflare-kv --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && env -u REPLICATE_API_TOKEN NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://ai-emoji-generator-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret REPLICATE_API_TOKEN --worker "ai-emoji-generator-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the home page renders to its end (`</html>` — a render that
    # throws partway through a streamed page still sent a 200), and
    # /api/health answers ok — which only the Worker can, by counting the
    # emojis table through its DB binding, so it proves the database bound,
    # the migrations applied and the Worker serving, whether or not Replicate
    # is connected. Read-only. Each response is buffered before grep so an
    # early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q '</html>' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
